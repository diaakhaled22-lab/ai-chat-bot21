<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="botCoreOuter" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="botCoreVisor" x1="16" y1="22" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1536" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="botPulseGrad" x1="20" y1="36" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Top signal node -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="url(#botCoreOuter)" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="6.5" r="3" fill="#38BDF8" />

  <!-- Rounded hexagon / shield core -->
  <path
    d="M32 12.5L50.5 21.5C52.6 22.5 54 24.7 54 27V39.5C54 42.3 52.4 44.9 49.9 46.2L34.7 54.3C33 55.2 31 55.2 29.3 54.3L14.1 46.2C11.6 44.9 10 42.3 10 39.5V27C10 24.7 11.4 22.5 13.5 21.5L32 12.5Z"
    fill="url(#botCoreOuter)"
  />

  <!-- Subtle inner rim highlight -->
  <path
    d="M32 15.2L48.6 23.3C50.1 24 51 25.5 51 27.1V39.2C51 41.1 49.9 42.8 48.3 43.7L34.1 51.2C32.8 51.9 31.2 51.9 29.9 51.2L15.7 43.7C14.1 42.8 13 41.1 13 39.2V27.1C13 25.5 13.9 24 15.4 23.3L32 15.2Z"
    stroke="white"
    stroke-opacity="0.28"
    stroke-width="1.2"
  />

  <!-- Dark Visor -->
  <rect x="16.5" y="23.5" width="31" height="19.5" rx="7.5" fill="url(#botCoreVisor)" stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="1.2" />

  <!-- Minimalist Glowing Eyes -->
  <rect x="22" y="27.5" width="4.5" height="4.5" rx="2.25" fill="#67E8F9" />
  <rect x="37.5" y="27.5" width="4.5" height="4.5" rx="2.25" fill="#67E8F9" />

