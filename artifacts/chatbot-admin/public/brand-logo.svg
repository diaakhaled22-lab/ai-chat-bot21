  <path
    d="M21 37.2H26.2L28.5 33.4L31.4 40L34.3 32.5L36.8 37.2H43"
    stroke="url(#botPulseGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Side connection nodes -->
  <circle cx="8" cy="33" r="2.2" fill="#38BDF8" />
  <circle cx="56" cy="33" r="2.2" fill="#38BDF8" />
