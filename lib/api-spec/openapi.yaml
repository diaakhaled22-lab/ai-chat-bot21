openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Chatbot Admin Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: admin-clients
    description: Admin client management
  - name: admin-companies
    description: Admin company management
  - name: admin-chat-logs
    description: Admin chat logs
  - name: admin-stats
    description: Admin dashboard stats
  - name: admin-settings
    description: Admin settings
  - name: client-company
    description: Client company management
  - name: client-chat-logs
    description: Client chat logs
  - name: client-settings
    description: Client settings
  - name: client-knowledge-files
    description: Client company knowledge files (uploaded documents / linked Google Sheets)
  - name: storage
    description: Object storage upload/serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid login credentials

  /auth/client/login:
    post:
      operationId: clientLogin
      tags: [auth]
      summary: Client login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid login credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not authenticated

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin-stats]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/clients:
    get:
      operationId: listClients
      tags: [admin-clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [admin-clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /admin/clients/{id}:
    put:
      operationId: updateClient
      tags: [admin-clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [admin-clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client deleted

  /admin/companies:
    get:
      operationId: listCompanies
      tags: [admin-companies]
      summary: List all companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"

  /admin/companies/{id}:
    get:
      operationId: getCompany
      tags: [admin-companies]
      summary: Get company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompanyMyId
      tags: [admin-companies]
      summary: Update a company's custom ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                myId:
                  type: ["string", "null"]
                securityPrompt:
                  type: ["string", "null"]
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    delete:
      operationId: deleteCompany
      tags: [admin-companies]
      summary: Delete a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /admin/companies/{id}/status:
    patch:
      operationId: toggleCompanyStatus
      tags: [admin-companies]
      summary: Toggle company active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /admin/companies/{id}/logs:
    get:
      operationId: getCompanyActivityLogs
      tags: [admin-companies]
      summary: Get activity log history for a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company activity logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyActivityLog"

  /admin/chat-logs:
    get:
      operationId: listAllChatLogs
      tags: [admin-chat-logs]
      summary: List all chat logs across companies
      parameters:
        - name: companyId
          in: query
          schema:
            type: ["integer", "null"]
        - name: channel
          in: query
          schema:
            type: ["string", "null"]
        - name: fromDate
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: toDate
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Chat logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatLog"

  /admin/chat-logs/{id}:
    delete:
      operationId: deleteChatLog
      tags: [admin-chat-logs]
      summary: Delete a chat log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /admin/chat-logs/{id}/read:
    patch:
      operationId: markAdminChatLogAsRead
      tags: [admin-chat-logs]
      summary: Mark an admin chat log entry as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Log marked as read
        "400":
          description: Invalid id
        "404":
          description: Not found

  /admin/chat-log-retention:
    get:
      operationId: getAdminChatLogRetention
      tags: [admin-settings]
      summary: Get the platform-wide chat log auto-delete retention setting
      responses:
        "200":
          description: Retention setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatLogRetentionResult"
    put:
      operationId: updateAdminChatLogRetention
      tags: [admin-settings]
      summary: Update the platform-wide chat log auto-delete retention setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatLogRetentionInput"
      responses:
        "200":
          description: Updated

  /admin/audit-logs:
    get:
      summary: Get admin audit logs
      tags:
        - admin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminActivityLog"
        "401":
          description: Unauthorized
  /admin/audit-logs/{id}:
    delete:
      operationId: deleteAdminAuditLog
      tags:
        - admin
      summary: Delete an admin audit log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit log deleted
        "400":
          description: Invalid ID
        "404":
          description: Audit log not found
        "401":
          description: Unauthorized
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin-settings]
      summary: Get admin settings
      responses:
        "200":
          description: Admin settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResult"
    put:
      operationId: updateAdminSettings
      tags: [admin-settings]
      summary: Update admin credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsInput"
      responses:
        "200":
          description: Updated

  /client/company:
    get:
      operationId: getClientCompany
      tags: [client-company]
      summary: Get client's company
      responses:
        "200":
          description: Client company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: No company yet
    post:
      operationId: createClientCompany
      tags: [client-company]
      summary: Create client's company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    put:
      operationId: updateClientCompany
      tags: [client-company]
      summary: Update client's company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /client/company/test-google-sheet:
    post:
      operationId: testClientGoogleSheetConnection
      tags: [client-company]
      summary: Test the configured Google Sheet connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestGoogleSheetInput"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestGoogleSheetResult"

  /client/chat-logs:
    get:
      operationId: listClientChatLogs
      tags: [client-chat-logs]
      summary: List chat logs for client's company
      parameters:
        - name: channel
          in: query
          schema:
            type: ["string", "null"]
        - name: fromDate
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: toDate
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Chat logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatLog"

  /client/chat-logs/session/{sessionId}/read:
    patch:
      operationId: markClientSessionAsRead
      tags: [client-chat-logs]
      summary: Mark a session as read
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session marked as read

  /client/chat-logs/{id}/read:
    patch:
      operationId: markClientLogAsRead
      tags: [client-chat-logs]
      summary: Mark a single log entry as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Log marked as read

  /client/chat-logs/{id}:
    delete:
      operationId: deleteClientChatLog
      tags: [client-chat-logs]
      summary: Delete a chat log entry belonging to the client's company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /client/chat-log-retention:
    get:
      operationId: getClientChatLogRetention
      tags: [client-settings]
      summary: Get the client's chat log auto-delete retention setting
      responses:
        "200":
          description: Retention setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatLogRetentionResult"
    put:
      operationId: updateClientChatLogRetention
      tags: [client-settings]
      summary: Update the client's chat log auto-delete retention setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatLogRetentionInput"
      responses:
        "200":
          description: Updated

  /client/settings:
    put:
      operationId: updateClientSettings
      tags: [client-settings]
      summary: Update client credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSettingsInput"
      responses:
        "200":
          description: Updated

  /client/company/knowledge-files:
    get:
      operationId: listClientKnowledgeFiles
      tags: [client-knowledge-files]
      summary: List knowledge files for the client's company
      responses:
        "200":
          description: Knowledge files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeFile"
    post:
      operationId: createClientKnowledgeFile
      tags: [client-knowledge-files]
      summary: Register an uploaded file or a Google Sheet link as a knowledge source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeFileInput"
      responses:
        "201":
          description: Knowledge file registered and queued for parsing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFile"
        "400":
          description: Invalid input

  /client/company/knowledge-files/{id}:
    delete:
      operationId: deleteClientKnowledgeFile
      tags: [client-knowledge-files]
      summary: Delete a knowledge file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL to upload a knowledge file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "401":
          description: Unauthorized

  /webhook/message:
    post:
      operationId: ingestChatMessage
      tags: [webhook]
      summary: Receive a chatbot conversation and store it as a chat log
      description: >
        Called by your chatbot after each conversation turn. Authenticate using
        the channel-specific API key configured in the company settings
        (telegramBotApiKey, whatsappApiToken, messengerApiKey, or websiteChatbotKey).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookMessageInput"
      responses:
        "201":
          description: Chat log saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMessageResult"
        "401":
          description: Invalid API key
        "404":
          description: Company not found for the given key

  /auth/admin/login/verify-2fa:
    post:
      operationId: adminLoginVerify2fa
      tags: [auth]
      summary: Admin 2FA verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempToken, code]
              properties:
                tempToken:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Missing or invalid token/code
        "401":
          description: Invalid code or expired session

  /admin/security/2fa:
    get:
      operationId: adminGet2faStatus
      tags: [admin]
      summary: Check if 2FA is enabled
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isEnabled:
                    type: boolean

  /admin/security/2fa/generate:
    post:
      operationId: adminGenerate2fa
      tags: [admin]
      summary: Generate a new 2FA secret
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrCodeDataUrl:
                    type: string

  /admin/security/2fa/enable:
    post:
      operationId: adminEnable2fa
      tags: [admin]
      summary: Enable 2FA by verifying the generated code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/security/2fa/disable:
    post:
      operationId: adminDisable2fa
      tags: [admin]
      summary: Disable 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  schemas:
    AdminActivityLog:
      type: object
      properties:
        id:
          type: integer
        adminId:
          type: integer
        adminUsername:
          type: string
        action:
          type: string
        details:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [role, name]
      properties:
        role:
          type: string
          enum: [admin, client]
        name:
          type: string
        id:
          type: ["integer", "null"]
        requires2FA:
          type: boolean
        tempToken:
          type: string

    SessionUser:
      type: object
      required: [role, name]
      properties:
        role:
          type: string
          enum: [admin, client]
        name:
          type: string
        id:
          type: ["integer", "null"]

    AdminStats:
      type: object
      required: [totalCompanies, activeCompanies, inactiveCompanies, totalClients, totalChatLogs, todayChatLogs, quotaCompanies]
      properties:
        totalCompanies:
          type: integer
        activeCompanies:
          type: integer
        inactiveCompanies:
          type: integer
        quotaCompanies:
          type: integer
          description: Companies with an assigned token quota
        totalClients:
          type: integer
        totalChatLogs:
          type: integer
          description: Total chat log entries across all companies and channels
        todayChatLogs:
          type: integer
          description: Chat log entries created today

    Client:
      type: object
      required: [id, name, username, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: string
        createdAt:
          type: string
        hasCompany:
          type: boolean

    ClientInput:
      type: object
      required: [name, username, password]
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        password:
          type: ["string", "null"]

    Company:
      type: object
      required: [id, clientId, name, isActive, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        myId:
          type: ["string", "null"]
          description: Custom identifier set by the admin (e.g. an internal reference code).
        name:
          type: string
        generalInfo:
          type: ["string", "null"]
        isActive:
          type: boolean
        activationStart:
          type: ["string", "null"]
          description: ISO 8601 timestamp for subscription start.
        activationEnd:
          type: ["string", "null"]
          description: ISO 8601 timestamp for subscription end.
        systemPrompt:
          type: ["string", "null"]
        securityPrompt:
          type: ["string", "null"]
        googleSheetsEnabled:
          type: boolean
        googleSheetsLink:
          type: ["string", "null"]
        googleSheetsName:
          type: ["string", "null"]
        googleSheetsPage:
          type: ["string", "null"]
        serviceAccountKey:
          type: ["string", "null"]
        aiAgentApiKey:
          type: ["string", "null"]
        aiAgentUrl:
          type: ["string", "null"]
        aiProvider:
          type: ["string", "null"]
          enum: ["openai", "anthropic", "google", "openrouter", null]
        aiModel:
          type: ["string", "null"]
        monthlyTokenQuota:
          type: ["integer", "null"]
        telegramBotApiKey:
          type: ["string", "null"]
        telegramBotUsername:
          type: ["string", "null"]
          description: Auto-fetched from Telegram via getMe when the bot token is saved. Used to build the public t.me/<username> share link.
        telegramEnabled:
          type: ["boolean", "null"]
          description: Whether the Telegram channel is enabled for this company.
        whatsappApiToken:
          type: ["string", "null"]
        whatsappPhoneNumberId:
          type: ["string", "null"]
        whatsappBusinessAccountId:
          type: ["string", "null"]
        whatsappNumber:
          type: ["string", "null"]
          description: Public WhatsApp phone number (international format) used to build the wa.me/<number> share link. Distinct from whatsappApiToken, which is the backend credential.
        whatsappEnabled:
          type: ["boolean", "null"]
          description: Whether the WhatsApp channel is enabled for this company.
        messengerApiKey:
          type: ["string", "null"]
        messengerPageId:
          type: ["string", "null"]
          description: Auto-fetched from Meta's Graph API when the Page Access Token is saved. Used to build the public m.me/<pageId> share link.
        messengerEnabled:
          type: ["boolean", "null"]
          description: Whether the Messenger channel is enabled for this company.
        websiteChatbotKey:
          type: ["string", "null"]
        widgetEnabled:
          type: ["boolean", "null"]
          description: Whether the website widget channel is enabled for this company.
        websiteDataUrl:
          type: ["string", "null"]
        websiteAutoSync:
          type: boolean
          description: Whether to periodically scrape and cache the websiteDataUrl for use in AI prompts.
        fabEnabled:
          type: boolean
          description: Whether the client website embed snippet should use the floating action button.
